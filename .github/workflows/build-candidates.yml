name: Build platform candidates

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix desktop
      - run: node desktop/package.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - run: node scripts/archive-release.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wrong-floor-${{ matrix.target }}-${{ matrix.arch }}
          path: releases/*
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm ci
      - run: npm test
      - run: npm run package:web
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: wrong-floor-web
          path: releases/*
          if-no-files-found: error
